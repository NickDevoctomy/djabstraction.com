---
layout: default
---
{%- assign backdrop_img = background | cover: 960 -%}
{% include backdrop.html image1=backdrop_img %}

<header class="wrap{% unless wide %} wrap--narrow{% endunless %} page-head">
  <h1 class="page-head__title">{{ title }}</h1>
  {% if description %}<p class="page-head__lede">{{ description }}</p>{% endif %}
</header>

<div class="wrap{% unless wide %} wrap--narrow{% endunless %}">
  {% if wide %}
  {{ content }}
  {% else %}
  <div class="prose prose--panel">
    {{ content }}
  </div>
  {% endif %}
</div>
