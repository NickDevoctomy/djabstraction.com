<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>
    {% if layout == "mix" and episodeno %}{{ site.podcast_shorttitle | escape }} {{ subtitle | remove: "Episode " }} - {{ site.title | escape }}
    {% elsif title and title != site.title %}{{ title | escape }} - {{ site.title | escape }}
    {% else %}{{ site.title | escape }}{% endif %}
  </title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" />
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}" />
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}" />
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ "/feed.xml" | relative_url }}" />
  <link rel="alternate" type="application/rss+xml" title="{{ site.podcast_title | escape }}" href="{{ "/feed/podcast.xml" | relative_url }}" />

  <!-- App -->
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png" />
  <meta name="theme-color" content="{{ site.background }}" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="{{ site.title | escape }}" />

  <!-- Meta Tags -->
  <meta name="description" content="{% if description %}{{ description | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}" />
  {% if keywords %}
  <meta name="keywords" content="{{ keywords | join: ", " }}" />
  {% endif %}
  <meta name="twitter:card" content="summary_large_image" />
  <meta property="og:url" content="{{ page.url | replace:'index.html','' | absolute_url }}" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{% if title %}{{ title }}{% else %}{{ site.title }}{% endif %}" />
  <meta property="og:description" content="{{ excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}" />
  {% if episodeimg %}
  <meta property="og:image" content="{{ site.url }}{{ episodeimg }}" />
  {% elsif background %}
  <meta property="og:image" content="{{ site.url }}{{ background }}" />
  {% endif %}

  {% if site.google_tagmanager %}
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','{{ site.google_tagmanager }}');</script>
  <!-- End Google Tag Manager -->
  {% endif %}

  {% if layout == "mix" %}
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MusicPlaylist",
      "name": {{ site.podcast_title | append: " - Episode " | append: episodeno | to_json }},
      "numTracks": {{ tracklist.size }},
      "track": [
        {%- for track in tracklist %}
        {
          "@type": "MusicRecording",
          "name": {{ track.title | to_json }},
          "byArtist": { "@type": "MusicGroup", "name": {{ track.artist | strip | to_json }} }
          {%- if track.purchaseurl %},
          "url": {{ track.purchaseurl | to_json }}{% endif %}
        }{% unless forloop.last %},{% endunless %}
        {%- endfor %}
      ]
    }
  </script>
  {% endif %}

  <script src="{{ "/assets/app.js" | relative_url }}" defer></script>
</head>
